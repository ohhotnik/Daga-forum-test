
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAGA TEST</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3fb;color:#172b49;font-family:Arial}
header{background:#1769d2;color:white;padding:20px;text-align:center}
main{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 14px #17365b12}
input,select,textarea,button{width:100%;padding:12px;margin:6px 0;border:1px solid #cbd8e9;border-radius:9px;font-size:15px}
button{background:#1769d2;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#e5efff;color:#1756a0}
.hidden{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.item{background:#eaf2ff;padding:15px;border-radius:10px;text-align:center;cursor:pointer;font-weight:bold}
h2{color:#1769d2}
small{color:#61738b}
</style>
</head>
<body>
<header>
<h1>DAGA TEST</h1>
<p>Форум игрового сообщества</p>
</header>

<main>
<section id="auth" class="card">
<h2>Вход / Регистрация</h2>
<input id="nick" placeholder="Ваш ник" maxlength="20">
<input id="pass" type="password" placeholder="Пароль">
<button onclick="register()">Регистрация</button>
<button class="secondary" onclick="login()">Войти</button>
<p id="authMsg"></p>
</section>

<section id="forum" class="hidden">
<div class="card">
<h2 id="welcome"></h2>
<button class="secondary" onclick="logout()">Выйти</button>
</div>

<div class="card">
<h2>Государство</h2>
<div id="stateList" class="grid"></div>
</div>

<div class="card">
<h2>ОПГ</h2>
<div id="crimeList" class="grid"></div>
</div>

<div id="orgPage" class="card hidden">
<h2 id="orgTitle"></h2>
<div id="orgContent"></div>
<button class="secondary" onclick="closeOrg()">Назад</button>
</div>

<div class="card">
<h2>Заявление на повышение</h2>
<select id="applicationOrg"></select>
<textarea id="applicationText" placeholder="Напишите заявление"></textarea>
<button onclick="sendApplication()">Отправить на рассмотрение</button>
</div>

<div class="card">
<h2>Мои заявления</h2>
<div id="myApplications">Пока нет заявлений</div>
</div>

<div id="adminPanel" class="card hidden">
<h2>Администрация</h2>
<div id="applications"></div>
</div>

<div id="developerPanel" class="card hidden">
<h2>Панель разработчика</h2>
<p>Wells_Ohhotnik — Разработчик</p>
<p>Назначение настоящих прав выполняется через защищённую систему Firebase.</p>
</div>
</section>
</main>

<script>
const DEVELOPER_UID = "oEfrMISFDeSgODsdlswvxwH7RK62";

const stateOrgs = ["УМВД","ГИБДД","СМИ","ЦБ","Армия"];
const crimeOrgs = ["Лыткарино","Арзамас","Батыровка"];

const adminRanks = [
"Младший модератор",
"Модератор",
"Старший модератор",
"Младший администратор",
"Администратор",
"Старший администратор",
"Куратор",
"Технический специалист",
"Заместитель главной администрации",
"Главный администратор",
"Заместитель разработчика",
"Разработчик"
];

let users = JSON.parse(localStorage.getItem("daga_users") || "{}");
let apps = JSON.parse(localStorage.getItem("daga_apps") || "[]");
let current = null;

function save(){
 localStorage.setItem("daga_users",JSON.stringify(users));
 localStorage.setItem("daga_apps",JSON.stringify(apps));
}

function register(){
 let n=nick.value.trim();
 let p=pass.value;
 if(!/^[a-zA-Z0-9_]{3,20}$/.test(n)){
  authMsg.textContent="Ник: 3–20 латинских букв, цифр или _";
  return;
 }
 if(p.length<6){authMsg.textContent="Пароль минимум 6 символов";return}
 let key=n.toLowerCase();
 if(users[key]){authMsg.textContent="Этот ник уже занят";return}
 users[key]={nick:n,password:p,role:"player"};
 save();
 authMsg.textContent="Регистрация успешна. Теперь войдите.";
}

function login(){
 let key=nick.value.trim().toLowerCase();
 let p=pass.value;
 if(!users[key] || users[key].password!==p){
  authMsg.textContent="Неверный ник или пароль";return;
 }
 current=key;
 showForum();
}

function showForum(){
 auth.classList.add("hidden");
 forum.classList.remove("hidden");
 welcome.textContent="Добро пожаловать, "+users[current].nick;
 stateList.innerHTML="";
 crimeList.innerHTML="";
 [...stateOrgs].forEach(o=>addOrg(stateList,o));
 [...crimeOrgs].forEach(o=>addOrg(crimeList,o));
 applicationOrg.innerHTML=[...stateOrgs,...crimeOrgs]
  .map(o=>`<option>${o}</option>`).join("");
 let role=users[current].role;
 adminPanel.classList.toggle("hidden",!["admin","developer"].includes(role));
 developerPanel.classList.toggle("hidden",role!=="developer");
 renderApplications();
 renderMine();
}

function addOrg(parent,name){
 let div=document.createElement("div");
 div.className="item";
 div.textContent=name;
 div.onclick=()=>openOrg(name);
 parent.appendChild(div);
}

function openOrg(name){
 orgPage.classList.remove("hidden");
 orgTitle.textContent=name;
 let isState=stateOrgs.includes(name);
 orgContent.innerHTML=isState
 ? "<h3>Младший состав</h3><p>Участники младшего состава</p><h3>Старший состав</h3><p>Участники старшего состава</p>"
 : "<h3>Состав организации</h3><p>Участники "+name+"</p>";
}
function closeOrg(){orgPage.classList.add("hidden")}

function sendApplication(){
 let text=applicationText.value.trim();
 if(!text){alert("Напишите заявление");return}
 apps.push({
  id:Date.now(),user:current,
  org:applicationOrg.value,
  text,status:"На рассмотрении"
 });
 save();applicationText.value="";
 renderApplications();renderMine();
 alert("Заявление отправлено на рассмотрение");
}

function renderMine(){
 let mine=apps.filter(a=>a.user===current);
 myApplications.innerHTML=mine.length
 ?mine.map(a=>`<p><b>${a.org}</b> — ${a.status}</p>`).join("")
 :"Пока нет заявлений";
}

function renderApplications(){
 if(!["admin","developer"].includes(users[current].role))return;
 applications.innerHTML="";
 apps.forEach(a=>{
  let div=document.createElement("div");
  div.className="card";
  let info=document.createElement("p");
  info.textContent=a.user+" / "+a.org+" / "+a.text+" / "+a.status;
  div.appendChild(info);
  if(a.status==="На рассмотрении"){
   ["Одобрено","Отклонено"].forEach(status=>{
    let b=document.createElement("button");
    b.textContent=status;
    b.onclick=()=>changeStatus(a.id,status);
    div.appendChild(b);
   });
  }
  applications.appendChild(div);
 });
}

function changeStatus(id,status){
 if(!["admin","developer"].includes(users[current].role))return;
 let a=apps.find(x=>x.id===id);
 if(a){a.status=status;save();renderApplications();renderMine()}
}

function logout(){
 current=null;
 forum.classList.add("hidden");
 auth.classList.remove("hidden");
}

</script>
</body>
</html>

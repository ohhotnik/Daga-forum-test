
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ЛАПОЧКА — Horror Online</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;overflow:hidden;background:#050508;
 color:white;font-family:Arial,sans-serif;
 touch-action:none;
}
button,input{font:inherit}
#menu{
 position:fixed;inset:0;z-index:10;
 background:radial-gradient(#241018,#050508 75%);
 display:flex;align-items:center;justify-content:center;
 padding:20px;
}
.panel{
 width:100%;max-width:400px;padding:25px;
 background:#111117;border:1px solid #63212f;
 border-radius:18px;box-shadow:0 0 35px #000;
}
h1{text-align:center;color:#ff304d;letter-spacing:5px}
.subtitle{text-align:center;color:#999;font-size:12px}
input,button{
 width:100%;padding:14px;margin:7px 0;
 border:0;border-radius:9px;
}
input{background:#292932;color:white}
button{
 background:#c92340;color:white;font-weight:bold;
}
button.secondary{background:#34343f}
button:disabled{opacity:.4}
#game{position:fixed;inset:0}
#hud{
 position:fixed;inset:0;pointer-events:none;
}
#top{
 position:absolute;top:15px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 text-shadow:0 2px 5px black;
}
.hudbox{
 background:#0009;padding:10px;border-radius:8px;
}
#role{
 position:absolute;top:70px;width:100%;
 text-align:center;color:#ff5267;
 font-weight:bold;text-shadow:0 2px 5px black;
}
#joystick{
 position:absolute;left:25px;bottom:35px;
 width:125px;height:125px;border-radius:50%;
 background:#ffffff20;border:2px solid #ffffff55;
 pointer-events:auto;touch-action:none;
}
#stick{
 position:absolute;left:37px;top:37px;
 width:48px;height:48px;border-radius:50%;
 background:#ffffff99;
}
#flash{
 position:absolute;right:25px;bottom:45px;
 width:72px;height:72px;border-radius:50%;
 background:#d42b45;border:2px solid #ff8798;
 pointer-events:auto;
}
#leave{
 position:absolute;right:12px;top:65px;
 width:auto;padding:10px 15px;
 pointer-events:auto;background:#292932;
}
#message{
 position:fixed;bottom:12px;left:0;right:0;
 text-align:center;color:white;
 text-shadow:0 2px 5px black;
 pointer-events:none;
}
#lookArea{
 position:absolute;right:0;top:100px;
 width:55%;height:55%;
 pointer-events:auto;
}
[hidden]{display:none!important}
</style>
</head>

<body>

<section id="menu">
<div class="panel">
<h1>ЛАПОЧКА</h1>
<p class="subtitle">MULTIPLAYER HORROR</p>

<input id="nickname" maxlength="20"
placeholder="Твой игровой ник">

<button id="create">СОЗДАТЬ КОМНАТУ</button>

<p class="subtitle">ИЛИ ВВЕДИ КОД</p>

<input id="roomCode" maxlength="6"
placeholder="КОД КОМНАТЫ">

<button class="secondary" id="join">ВОЙТИ В КОМНАТУ</button>

<p id="menuMessage" class="subtitle"></p>
</div>
</section>

<div id="game" hidden></div>

<div id="hud" hidden>
 <div id="top">
  <div class="hudbox" id="roomLabel">КОМНАТА</div>
  <div class="hudbox" id="playersLabel">0 / 8</div>
 </div>

 <div id="role">ОЖИДАНИЕ</div>

 <button id="leave">ВЫЙТИ</button>

 <div id="lookArea"></div>

 <div id="joystick">
  <div id="stick"></div>
 </div>

 <button id="flash">☼</button>

 <div id="message">Найди выход...</div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js";

import {initializeApp} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";

import {
 getDatabase,ref,get,runTransaction,
 onValue,update,remove,onDisconnect
} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

import {
 getAuth,signInAnonymously
} from
"https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";


// FIREBASE CONFIG

const firebaseConfig={
 apiKey:"AIzaSyAMCgVPoPd_NS9ahlCp5Ka9YNT2dk-viwg",
 authDomain:"lapochka-76772.firebaseapp.com",
 databaseURL:"https://lapochka-76772-default-rtdb.europe-west1.firebasedatabase.app",
 projectId:"lapochka-76772",
 storageBucket:"lapochka-76772.firebasestorage.app",
 messagingSenderId:"146260614860",
 appId:"1:3b8177d3ab5bd714b6ec69",
 measurementId:"G-5Z6XZKECD7"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);
const auth=getAuth(app);

let uid=null;
let roomCode=null;
let myRole=null;
let roomListener=null;
let players={};
let scene,camera,renderer;
let localPlayer;
let playerObjects={};
let yaw=0;
let pitch=0;
let flashlight;
let flashOn=true;
let lastSync=0;
let running=false;

const $=id=>document.getElementById(id);

function say(t){
 $("message").textContent=t;
}
function menuSay(t){
 $("menuMessage").textContent=t;
}

try{
 const user=await signInAnonymously(auth);
 uid=user.user.uid;
 menuSay("Firebase подключён");
}catch(e){
 menuSay("Ошибка Firebase: "+e.message);
}


// RANDOM ROOM CODE

function makeCode(){
 const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 const arr=new Uint8Array(6);
 crypto.getRandomValues(arr);
 return [...arr].map(x=>chars[x%chars.length]).join("");
}


// CREATE ROOM

async function createRoom(){

 if(!uid)return menuSay("Нет подключения Firebase");

 const name=$("nickname").value.trim();
 if(!name)return menuSay("Введи ник");

 $("create").disabled=true;

 try{

  for(let i=0;i<10;i++){

   const code=makeCode();
   const roomRef=ref(db,"rooms/"+code);

   const result=await runTransaction(roomRef,room=>{

    if(room!==null)return;

    return {
     status:"waiting",
     maxPlayers:8,
     monsterId:null,
     createdAt:Date.now(),
     players:{
      [uid]:{
       name,
       role:"waiting",
       x:0,
       z:0,
       rot:0,
       joinedAt:Date.now()
      }
     }
    };
   });

   if(result.committed){
    await onDisconnect(
     ref(db,"rooms/"+code+"/players/"+uid)
    ).remove();

    enterGame(code);
    return;
   }
  }

  menuSay("Не удалось создать комнату");

 }catch(e){
  menuSay(e.message);
 }finally{
  $("create").disabled=false;
 }
}


// JOIN ROOM

async function joinRoom(){

 if(!uid)return menuSay("Нет Firebase");

 const name=$("nickname").value.trim();
 const code=$("roomCode").value.trim().toUpperCase();

 if(!name||!code)return menuSay("Введи ник и код");

 $("join").disabled=true;

 try{

  const roomRef=ref(db,"rooms/"+code);

  const result=await runTransaction(roomRef,room=>{

   if(!room||room.status!=="waiting")return;

   const p=room.players||{};

   if(p[uid]||Object.keys(p).length>=8)return;

   p[uid]={
    name,
    role:"waiting",
    x:0,
    z:0,
    rot:0,
    joinedAt:Date.now()
   };

   room.players=p;

   if(Object.keys(p).length===8){

    const ids=Object.keys(p);
    const monster=ids[
     Math.floor(Math.random()*ids.length)
    ];

    ids.forEach(id=>{
     p[id].role=id===monster?"monster":"survivor";
    });

    room.monsterId=monster;
    room.status="playing";
    room.startedAt=Date.now();
   }

   return room;
  });

  if(!result.committed){
   menuSay("Комната не найдена, заполнена или игра началась");
   return;
  }

  await onDisconnect(
   ref(db,"rooms/"+code+"/players/"+uid)
  ).remove();

  enterGame(code);

 }catch(e){
  menuSay("Ошибка: "+e.message);
 }finally{
  $("join").disabled=false;
 }
}


// GAME ENTRY

function enterGame(code){

 roomCode=code;
 $("menu").hidden=true;
 $("game").hidden=false;
 $("hud").hidden=false;

 $("roomLabel").textContent="КОМНАТА "+code;

 start3D();

 if(roomListener)roomListener();

 roomListener=onValue(
  ref(db,"rooms/"+code),
  snap=>{

   if(!snap.exists()){
    say("Комната закрыта");
    return;
   }

   const room=snap.val();
   players=room.players||{};

   $("playersLabel").textContent=
    Object.keys(players).length+" / 8";

   const me=players[uid];

   if(!me){
    say("Ты покинул комнату");
    return;
   }

   myRole=me.role;

   $("role").textContent=
    myRole==="monster"?"ТЫ — МОНСТР":
    myRole==="survivor"?"ТЫ — ВЫЖИВШИЙ":
    "ОЖИДАНИЕ ИГРОКОВ";

   if(room.status==="playing"){
    say(myRole==="monster"?
     "Найди всех выживших!":
     "Найди выход и выживи!");
   }else{
    say("Ожидание восьми игроков...");
   }

   syncOtherPlayers();
  }
 );

}


// 3D SCENE

function start3D(){

 if(running)return;
 running=true;

 const container=$("game");

 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x050509);
 scene.fog=new THREE.FogExp2(0x08080d,0.055);

 camera=new THREE.PerspectiveCamera(
  75,innerWidth/innerHeight,0.1,100
 );

 camera.position.set(0,1.65,0);

 renderer=new THREE.WebGLRenderer({
  antialias:true
 });

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.shadowMap.enabled=true;

 container.appendChild(renderer.domElement);

 const ambient=new THREE.HemisphereLight(
  0x777788,0x111111,0.65
 );
 scene.add(ambient);

 const light=new THREE.PointLight(0xff3344,2,12);
 light.position.set(0,3,0);
 scene.add(light);

 // FLOOR

 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({
   color:0x292932,roughness:1
  })
 );

 floor.rotation.x=-Math.PI/2;
 floor.position.y=0;
 floor.receiveShadow=true;
 scene.add(floor);

 // CEILING

 const ceiling=new THREE.Mesh(
  new THREE.PlaneGeometry(40,40),
  new THREE.MeshStandardMaterial({
   color:0x111119,side:THREE.DoubleSide
  })
 );

 ceiling.rotation.x=Math.PI/2;
 ceiling.position.y=4;
 scene.add(ceiling);

 // WALLS

 const wallMaterial=new THREE.MeshStandardMaterial({
  color:0x34343e,roughness:0.9
 });

 function wall(x,y,z,w,h,d){

  const mesh=new THREE.Mesh(
   new THREE.BoxGeometry(w,h,d),
   wallMaterial
  );

  mesh.position.set(x,y,z);
  mesh.castShadow=true;
  mesh.receiveShadow=true;
  scene.add(mesh);
 }

 wall(0,2,-20,40,4,1);
 wall(0,2,20,40,4,1);
 wall(-20,2,0,1,4,40);
 wall(20,2,0,1,4,40);

 // INTERIOR WALLS

 wall(-7,2,-8,1,4,14);
 wall(7,2,8,1,4,14);
 wall(0,2,5,12,4,0.5);
 wall(-12,2,0,0.5,4,12);
 wall(12,2,0,0.5,4,12);

 // PILLARS

 for(let x=-15;x<=15;x+=10){
  for(let z=-15;z<=15;z+=10){

   const pillar=new THREE.Mesh(
    new THREE.BoxGeometry(0.7,4,0.7),
    wallMaterial
   );

   pillar.position.set(x,2,z);
   scene.add(pillar);
  }
 }

 // RED EXIT MARKER

 const exitLight=new THREE.PointLight(0xff001e,3,8);
 exitLight.position.set(0,2,-18);
 scene.add(exitLight);

 const exit=new THREE.Mesh(
  new THREE.BoxGeometry(3,3,0.2),
  new THREE.MeshStandardMaterial({
   color:0x770d21,
   emissive:0x33000a
  })
 );

 exit.position.set(0,1.5,-19.3);
 scene.add(exit);

 // FLASHLIGHT

 flashlight=new THREE.SpotLight(
  0xffffff,65,25,Math.PI/7,0.45,1
 );

 camera.add(flashlight);
 flashlight.position.set(0,0,0);
 flashlight.target.position.set(0,0,-1);
 camera.add(flashlight.target);
 scene.add(camera);

 // LOCAL PLAYER POSITION

 localPlayer={
  x:0,z:0
 };

 camera.position.set(0,1.65,0);

 animate();
}


// OTHER PLAYERS

function makePlayer(id,p){

 const group=new THREE.Group();

 const material=new THREE.MeshStandardMaterial({
  color:p.role==="monster"?0xaa1028:0x466c9c,
  roughness:0.8
 });

 const body=new THREE.Mesh(
  new THREE.CapsuleGeometry(0.35,0.8,4,8),
  material
 );

 body.position.y=0.9;
 group.add(body);

 const head=new THREE.Mesh(
  new THREE.SphereGeometry(0.24,12,10),
  material
 );

 head.position.y=1.65;
 group.add(head);

 group.userData.playerId=id;
 scene.add(group);

 playerObjects[id]=group;

}

function syncOtherPlayers(){

 if(!scene)return;

 Object.entries(players).forEach(([id,p])=>{

  if(id===uid)return;

  if(!playerObjects[id]){
   makePlayer(id,p);
  }

  const object=playerObjects[id];

  object.position.set(
   Number(p.x)||0,0,Number(p.z)||0
  );

  object.rotation.y=Number(p.rot)||0;

  const body=object.children[0];

  if(body){
   body.material.color.set(
    p.role==="monster"?0xc20e30:0x466c9c
   );
  }
 });

 Object.keys(playerObjects).forEach(id=>{
  if(!players[id]){
   scene.remove(playerObjects[id]);
   delete playerObjects[id];
  }
 });

}


// JOYSTICK

let joyX=0;
let joyY=0;
let joyActive=false;

const joystick=$("joystick");
const stick=$("stick");

joystick.addEventListener("pointerdown",e=>{
 joyActive=true;
 joystick.setPointerCapture(e.pointerId);
 moveJoy(e);
});

joystick.addEventListener("pointermove",e=>{
 if(joyActive)moveJoy(e);
});

function moveJoy(e){

 const rect=joystick.getBoundingClientRect();
 const cx=rect.left+rect.width/2;
 const cy=rect.top+rect.height/2;

 let dx=e.clientX-cx;
 let dy=e.clientY-cy;

 const max=40;
 const len=Math.hypot(dx,dy);

 if(len>max){
  dx=dx/len*max;
  dy=dy/len*max;
 }

 joyX=dx/max;
 joyY=dy/max;

 stick.style.transform=
  `translate(${dx}px,${dy}px)`;
}

function stopJoy(){
 joyActive=false;
 joyX=0;
 joyY=0;
 stick.style.transform="translate(0,0)";
}

joystick.addEventListener("pointerup",stopJoy);
joystick.addEventListener("pointercancel",stopJoy);


// CAMERA LOOK

let lookActive=false;
let lookX=0;
let lookY=0;

$("lookArea").addEventListener("pointerdown",e=>{
 lookActive=true;
 lookX=e.clientX;
 lookY=e.clientY;
 $("lookArea").setPointerCapture(e.pointerId);
});

$("lookArea").addEventListener("pointermove",e=>{

 if(!lookActive)return;

 const dx=e.clientX-lookX;
 const dy=e.clientY-lookY;

 lookX=e.clientX;
 lookY=e.clientY;

 yaw-=dx*0.006;
 pitch-=dy*0.005;

 pitch=Math.max(-1.2,Math.min(1.2,pitch));

});

$("lookArea").addEventListener("pointerup",()=>{
 lookActive=false;
});

$("lookArea").addEventListener("pointercancel",()=>{
 lookActive=false;
});


// KEYBOARD

const keys={};

addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true);
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);


// FLASHLIGHT

$("flash").onclick=()=>{

 flashOn=!flashOn;
 flashlight.visible=flashOn;

 $("flash").textContent=flashOn?"☼":"◉";
};


// MOVEMENT AND RENDER

let previous=performance.now();

function animate(now=performance.now()){

 if(!running)return;

 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,0.05);
 previous=now;

 const forward=
  -joyY+
  (keys["w"]||keys["arrowup"]?1:0)-
  (keys["s"]||keys["arrowdown"]?1:0);

 const side=
  joyX+
  (keys["d"]||keys["arrowright"]?1:0)-
  (keys["a"]||keys["arrowleft"]?1:0);

 const speed=myRole==="monster"?4.5:3.5;

 const fx=-Math.sin(yaw);
 const fz=-Math.cos(yaw);
 const sx=Math.cos(yaw);
 const sz=-Math.sin(yaw);

 const vx=(fx*forward+sx*side)*speed*dt;
 const vz=(fz*forward+sz*side)*speed*dt;

 if(localPlayer){

  localPlayer.x+=vx;
  localPlayer.z+=vz;

  localPlayer.x=Math.max(-18,Math.min(18,localPlayer.x));
  localPlayer.z=Math.max(-18,Math.min(18,localPlayer.z));

  camera.position.set(
   localPlayer.x,1.65,localPlayer.z
  );

  camera.rotation.order="YXZ";
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;
 }

 if(roomCode && localPlayer && now-lastSync>150){

  lastSync=now;

  update(
   ref(db,"rooms/"+roomCode+"/players/"+uid),
   {
    x:localPlayer.x,
    z:localPlayer.z,
    rot:yaw
   }
  ).catch(()=>{});
 }

 renderer.render(scene,camera);
}


// LEAVE ROOM

$("leave").onclick=async()=>{

 running=false;

 if(roomListener){
  roomListener();
  roomListener=null;
 }

 try{
  await remove(
   ref(db,"rooms/"+roomCode+"/players/"+uid)
  );

  await runTransaction(
   ref(db,"rooms/"+roomCode),
   room=>{
    if(!room)return;
    if(Object.keys(room.players||{}).length===0){
     return null;
    }
    return room;
   }
  );

 }catch(e){
  console.error(e);
 }

 if(renderer){
  renderer.dispose();
  renderer.domElement.remove();
 }

 $("game").hidden=true;
 $("hud").hidden=true;
 $("menu").hidden=false;

 roomCode=null;
 players={};
 playerObjects={};
 localPlayer=null;
 scene=null;
 roomListener=null;

};


// RESIZE

addEventListener("resize",()=>{

 if(!camera||!renderer)return;

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
});


// BUTTONS

$("create").onclick=createRoom;
$("join").onclick=joinRoom;

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hide & Seek 8 Players</title>
  <style>
    body {
      margin: 0;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .screen {
      width: min(1000px, 100%);
      text-align: center;
    }
    .box {
      background: #1a2438;
      border-radius: 15px;
      padding: 24px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.25);
    }
    input, button, select {
      width: 100%;
      padding: 12px 14px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
    }
    input, select {
      background: #dbeafe;
      color: #0f172a;
    }
    button {
      background: #38bdf8;
      color: #062033;
      font-weight: bold;
      cursor: pointer;
    }
    canvas {
      width: 100%;
      max-width: 980px;
      height: auto;
      border: 4px solid white;
      background: #08101d;
      border-radius: 12px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="screen">
    <div id="setup" class="box">
      <h1>8 Player Hide & Seek</h1>
      <input id="playerName" placeholder="Сіздің атыңыз" value="Игрок 1">
      <select id="roleSelect">
        <option value="hunter">Іздеуші</option>
        <option value="runner">Тығылған</option>
      </select>
      <button id="startBtn">Ойынды бастау</button>
    </div>

    <div id="gameBox" style="display:none">
      <canvas id="gameCanvas" width="980" height="560"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA4sTKOzeU59xkRmvexYh3VxKzMGmNRgOs",
      authDomain: "karatel-test-1806a.firebaseapp.com",
      databaseURL: "https://karatel-test-1806a-default-rtdb.firebaseio.com",
      projectId: "karatel-test-1806a",
      storageBucket: "karatel-test-1806a.firebasestorage.app",
      messagingSenderId: "448237119572",
      appId: "1:448237119572:web:b26c39d70555d39c04e5c1",
      measurementId: "G-2B1ZH4LV4E"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const setup = document.getElementById("setup");
    const gameBox = document.getElementById("gameBox");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const keys = {};
    let myId = null;
    let myRole = "hunter";
    let players = {};
    let gameStarted = false;

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function sendMyState() {
      if (!myId) return;
      const playerRef = ref(db, `players/${myId}`);
      set(playerRef, {
        id: myId,
        name: document.getElementById("playerName").value.trim() || "Игрок",
        role: myRole,
        x: randomBetween(50, canvas.width - 50),
        y: randomBetween(50, canvas.height - 50),
        color: myRole === "hunter" ? "#facc15" : "#38bdf8"
      });
    }

    function readGameState() {
      const playersRef = ref(db, "players");
      onValue(playersRef, (snapshot) => {
        players = snapshot.val() || {};
        draw();
      });
    }

    function drawPlayer(p) {
      ctx.fillStyle = p.color || "#fff";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.role === "hunter" ? 18 : 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.font = "12px Arial";
      ctx.fillText(p.name || "Player", p.x - 18, p.y - 18);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#08101d";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      Object.values(players).forEach(drawPlayer);
    }

    function updateLocalPlayer() {
      if (!myId) return;
      const p = players[myId];
      if (!p) return;

      let dx = 0, dy = 0;
      if (myRole === "hunter") {
        if (keys["ArrowUp"] || keys["w"]) dy -= 4;
        if (keys["ArrowDown"] || keys["s"]) dy += 4;
        if (keys["ArrowLeft"] || keys["a"]) dx -= 4;
        if (keys["ArrowRight"] || keys["d"]) dx += 4;
      } else {
        if (keys["ArrowUp"] || keys["w"]) dy -= 2;
        if (keys["ArrowDown"] || keys["s"]) dy += 2;
        if (keys["ArrowLeft"] || keys["a"]) dx -= 2;
        if (keys["ArrowRight"] || keys["d"]) dx += 2;
      }

      p.x = Math.max(20, Math.min(canvas.width - 20, p.x + dx));
      p.y = Math.max(20, Math.min(canvas.height - 20, p.y + dy));

      const playerRef = ref(db, `players/${myId}`);
      set(playerRef, p);
    }

    function loop() {
      if (gameStarted) {
        updateLocalPlayer();
        draw();
      }
      requestAnimationFrame(loop);
    }

    document.getElementById("startBtn").addEventListener("click", () => {
      myRole = document.getElementById("roleSelect").value;
      myId = "player_" + Date.now() + "_" + Math.floor(Math.random() * 999);
      setup.style.display = "none";
      gameBox.style.display = "block";
      gameStarted = true;
      sendMyState();
      readGameState();
    });

    document.addEventListener("keydown", e => {
      keys[e.key] = true;
    });

    document.addEventListener("keyup", e => {
      keys[e.key] = false;
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
